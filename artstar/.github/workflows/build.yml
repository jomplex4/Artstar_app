name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso a gradlew
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleRelease

      - name: Renombrar APK
        run: mv app/build/outputs/apk/release/app-release.apk ART-STAR-${{ github.ref_name }}.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ART-STAR-apk
          path: ART-STAR-*.apk

      - name: Publicar en Releases (solo con tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ART-STAR-*.apk
