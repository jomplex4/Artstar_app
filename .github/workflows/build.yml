$yml = @'
name: Compilar APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease
      - name: Renombrar APK
        run: mv app/build/outputs/apk/release/app-release.apk ART-STAR-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ART-STAR-*.apk
'@
[System.IO.File]::WriteAllText("$PWD\.github\workflows\build.yml", $yml, (New-Object System.Text.UTF8Encoding($false)))